<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Deep Space Cosmic Background with subtle glow -->
  <rect width="64" height="64" rx="14" fill="#06080b"/>
  <rect width="64" height="64" rx="14" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
  
  <defs>
    <!-- Planetary Horizon Arc Gradient -->
    <linearGradient id="orbitArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a3b50" stop-opacity="0.1"/>
      <stop offset="45%" stop-color="#739bbd" stop-opacity="0.6"/>
      <stop offset="78%" stop-color="#cbe8ff" stop-opacity="0.95"/>
      <stop offset="92%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#80a8cc" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Star Flare Radial Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#9ad2ff" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#3d7ab8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0e1724" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter for the Star -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Ambient blue atmosphere light inside the curved horizon -->
  <ellipse cx="32" cy="38" rx="22" ry="16" fill="rgba(80, 140, 210, 0.08)"/>

  <!-- Iconic Planetary Arc Horizon -->
  <path 
    d="M 12 40 A 21 21 0 0 1 50 31" 
    stroke="url(#orbitArc)" 
    stroke-width="2.4" 
    stroke-linecap="round"
  />

  <!-- Star Flare Glow Ring -->
  <circle cx="44.5" cy="20" r="10" fill="url(#starGlow)"/>

  <!-- 4-Point High-Intensity Diffraction Flare Star -->
  <path 
    d="M 44.5 9 L 45.7 18.8 L 55.5 20 L 45.7 21.2 L 44.5 31 L 43.3 21.2 L 33.5 20 L 43.3 18.8 Z" 
    fill="#ffffff"
  />
  <!-- Diagonal subtle spikes -->
  <path 
    d="M 44.5 14 L 45.2 19.3 L 50.5 20 L 45.2 20.7 L 44.5 26 L 43.8 20.7 L 38.5 20 L 43.8 19.3 Z" 
    fill="#cce8ff" 
    opacity="0.8"
  />

  <!-- Core Brilliant White Center -->
  <circle cx="44.5" cy="20" r="1.6" fill="#ffffff"/>

  <!-- Modern Geometric 'B' Monogram -->
  <g fill="#ffffff" transform="translate(18, 29)">
    <!-- Vertical spine -->
    <rect x="0" y="0" width="3.2" height="21" rx="0.8"/>
    <!-- Top Bar -->
    <rect x="0" y="0" width="13" height="3" rx="0.6"/>
    <!-- Middle Bar -->
    <rect x="0" y="9" width="10.5" height="2.8" rx="0.6"/>
    <!-- Bottom Bar -->
    <rect x="0" y="18" width="13" height="3" rx="0.6"/>
    <!-- Outer Right Upper & Lower Caps for distinct futuristic 'B' feel -->
    <rect x="11.5" y="0" width="3" height="9.5" rx="0.6"/>
    <rect x="11.5" y="11.5" width="3" height="9.5" rx="0.6"/>
  </g>

  <!-- Cyan AI dot accent -->
  <circle cx="39" cy="48" r="1.8" fill="#75c2ff"/>
</svg>